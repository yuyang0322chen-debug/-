<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FYDC 调研报告目录</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f6f6f6;
      color: #17224b;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 72px 24px;
    }

    h1 {
      font-size: 34px;
      margin: 0 0 10px;
    }

    .intro {
      color: #5b6573;
      margin: 0 0 32px;
    }

    .report-list {
      display: grid;
      gap: 16px;
    }

    .report {
      display: block;
      padding: 24px;
      background: #fff;
      border: 1px solid #e9e4da;
      border-radius: 20px;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(20,30,60,.06);
    }

    .report:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(20,30,60,.10);
    }

    .date {
      display: block;
      color: #7e9a3d;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .title {
      display: block;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .desc {
      color: #5b6573;
      line-height: 1.7;
    }

    .status {
      color: #7b8290;
      font-size: 14px;
      padding: 20px 0;
    }

    footer {
      margin-top: 40px;
      color: #7b8290;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <h1>FYDC 调研报告</h1>
    <p class="intro">车企、手机与可穿戴软件功能更新调研报告目录。</p>

    <div id="report-list" class="report-list">
      <div class="status">正在加载报告列表…</div>
    </div>

    <footer>
      后续只需上传新的 HTML 报告，目录会自动更新。
    </footer>
  </main>

  <script>
    const OWNER = "elio-chen0322";
    const REPO = "flash-report";

    const API =
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;

    const list = document.getElementById("report-list");

    function getDate(filename) {
      const match =
        filename.match(/(20\d{2})[-_](\d{2})[-_](\d{2})/);

      return match
        ? `${match[1]}-${match[2]}-${match[3]}`
        : "";
    }

    async function loadReports() {
      try {
        const response = await fetch(API);

        if (!response.ok) {
          throw new Error("GitHub API error");
        }

        const files = await response.json();

        const reports = files
          .filter(file => file.type === "file")
          .filter(file => /\.html?$/i.test(file.name))
          .filter(file =>
            file.name.toLowerCase() !== "index.html"
          )
          .map(file => ({
            ...file,
            reportDate: getDate(file.name)
          }))
          .sort((a, b) =>
            b.reportDate.localeCompare(a.reportDate)
          );

        list.innerHTML = "";

        reports.forEach(file => {
          const card = document.createElement("a");

          card.className = "report";
          card.href = "./" + encodeURIComponent(file.name);

          card.innerHTML = `
            <span class="date">
              ${file.reportDate || "未标注日期"}
            </span>

            <span class="title">
              FYDC 调研报告
            </span>

            <span class="desc">
              车企 / 手机 / 可穿戴 OTA 及发布会软件功能更新
            </span>
          `;

          list.appendChild(card);
        });

      } catch (error) {
        console.error(error);

        list.innerHTML =
          '<div class="status">报告列表加载失败，请刷新页面重试。</div>';
      }
    }

    loadReports();
  </script>
</body>
</html>
